<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Maré</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script defer src="assets/menu.js"></script>
</head>
<body>
  <main>
    <header class="page-head">
      <span class="kicker">Contact</span>
      <h1>Vamos conversar.</h1>
      <p class="lead">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    </header>

    <section class="section">
      <div class="contact-grid">
        <div>
          <div class="contact-block">
            <div class="label">E-mail</div>
            <a href="mailto:info@produtora.com">info@produtora.com</a>
          </div>
          <div class="contact-block">
            <div class="label">Telefone</div>
            <a href="tel:+5599999999999">+55 99 99999-9999</a>
          </div>
          <div class="contact-block">
            <div class="label">Estúdio</div>
            <a href="#">Rua Exemplo, 000 — São Paulo</a>
          </div>
        </div>

        <form class="form" onsubmit="event.preventDefault(); this.reset(); alert('Template — formulário sem envio real.');">
          <input type="text" placeholder="Seu nome" required>
          <input type="email" placeholder="Seu e-mail" required>
          <textarea placeholder="Conte sobre o projeto" required></textarea>
          <button class="btn" type="submit">Enviar mensagem &rarr;</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
